[datetime]
regex: \d{4}-\d{1,2}-\d{2,4} \d{2}:\d{2}:\d{2}
replace: DATETIME

[facelets]
regex: \u001b[48;2;245;245;245m\u001b[38;2;8;8;8m
replace: ""

[facelets_reset]
regex: \u001b[0;0m
replace: ""

[date]
regex: \d{4}-\d{1,2}-\d{2,4}
replace: DATE

[number]
regex: [\d+]?[.,]?\d+[.,]?\d+
replace: NUMBER
