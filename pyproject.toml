[build-system]
requires = ["setuptools>=74.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cubing-algs"
dynamic = ["version"]
description = "Comprehensive tools for Rubik's cube algorithm manipulation, analysis, and simulation."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["rubik", "cube", "speedcubing", "solve", "algorithm"]
authors = [{name = "Fantomas42", email = "fantomas42@gmail.com"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment :: Puzzle Games",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
    "kociemba==1.2.1",
]

[project.urls]
repository = "https://github.com/Fantomas42/cubing-algs"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "nbval",
    "pillow",
]
notebooks = [
    "jupyterlab",
]
opengl = [
    "moderngl>=5.12",
    "glfw>=2.10",
]

[tool.setuptools.packages.find]
include = ["cubing_algs*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "cubing_algs.__version__"}

[tool.setuptools]
ext-modules = [
    {name = "cubing_algs.extensions.rotate_2x2x2", sources = ["cubing_algs/extensions/rotate_2x2x2.c"], extra-compile-args = ["-O3", "-Wall"]},
    {name = "cubing_algs.extensions.rotate_3x3x3", sources = ["cubing_algs/extensions/rotate_3x3x3.c"], extra-compile-args = ["-O3", "-Wall"]},
    {name = "cubing_algs.extensions.rotate_dynamic", sources = ["cubing_algs/extensions/rotate_dynamic.c"], extra-compile-args = ["-O3", "-funroll-loops", "-fno-strict-aliasing", "-Wall"]}
]

[tool.setuptools.package-data]
cubing_algs = ["cases/*/*.json"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
show-fixes = true

[tool.ruff.lint]
preview = true
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "PT009",
    "PT027",
    "CPY001",
    "D203",
    "D205",
    "D212",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201"]
"examples/*.py" = ["T201"]
"cubing_algs/display/gl/*.py" = ["PLC0415"]
"cubing_algs/tests/test_display_gl_*.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pylint]
allow-magic-value-types = ["str", "int"]

[tool.mypy]
disable_error_code = ["import-untyped"]
exclude = ["poc"]
python_version = 3.12

[tool.pyright]
include = ["cubing_algs"]
exclude = [
    "cubing_algs/tests",
    "cubing_algs/poc",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest]
addopts = ["--cov=cubing_algs"]

[tool.coverage.run]
branch = true
omit = [
    "cubing_algs/tests/*",
    "cubing_algs/poc/*",
]

[tool.coverage.report]
show_missing = true
